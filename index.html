<!DOCTYPE html>
 <html>
    <head>
        <link rel = "stylesheet" href = "style.css" >
    </head>
    <body id = "Body">
        <div id = "Start-Screen">
            <h1 style="text-shadow: 0 0 15px greenyellow;">
                Tic-Tac-Toe                
            </h1>
            <button id = "playAI">Play With AI</button><br>
            <button id = "playlocal">Play local</button>
        </div>
        <div id = "AImodes">
            <button class = "Homebutton" id = "Homebutton1">
                ←Home
            </button>
            <h1 style="text-shadow: 0 0 15px greenyellow;">
                Tic-Tac-Toe                
            </h1>
            <h2 style="text-shadow: 0 0 15px greenyellow;">
                Choose Mode
            </h2>
            <button class = AImodes id = "Easy">Easy</button> 
            <button class = AImodes id = "Medium">Medium</button>           
            <button class = AImodes id = "Hard">Hard</button>           
                  
        </div>
        <div id = "Game-Screen">
             <button class = "Homebutton" id = "Homebutton2">
                ←Home
            </button>
            <h1 id =  "heading" style="text-shadow: 0 0 15px greenyellow;">
                Tic-Tac-Toe
            </h1>
            <h3 id = "mode">  
            </h3>
        
            <div id = "Score">
                <div id  = "Xscore">
                Player X :
                </div>
                <div id = "Oscore">
                Player O :
                </div>
            </div>
            <div id = "Board">
                <div class = "Cell"  id = "zero">
                </div>

                <div class = "Cell"  id = "one">
                </div>

                <div class = "Cell"  id = "two">
                </div>

                <div class = "Cell"  id = "three">
                </div>

                <div class = "Cell"  id = "four">
                </div>

                <div class = "Cell"  id = "five">
                </div>

                <div class = "Cell"  id = "six">
                </div>

                <div class = "Cell"  id = "seven">
                </div>

                <div class = "Cell"  id = "eight">
                </div>

            </div>
            <h3 id = "GameOver"></h3>
            <h3 id = "winner" ></h3>
            <button type = "button"  id = "restart">Restart</button>
        </div>
        <script src = "script.js"></script>
    </body>

</html>
